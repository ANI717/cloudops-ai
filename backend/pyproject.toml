[project]
name = "cloudops-backend"
version = "0.1.0"
description = "CloudOps AI backend API service"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54,<2.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Coverage is opt-in (`pytest --cov`) so running a single test locally
# doesn't trip the threshold. CI always runs with it.
[tool.coverage.run]
source = ["app"]  # measure application code only; tests/ is outside it
branch = true     # also check that both sides of each if/else run
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*_pb2.py",       # generated protobuf code
    "*_pb2_grpc.py",
]

[tool.coverage.report]
show_missing = true  # list uncovered line numbers in the terminal report
skip_empty = true    # hide empty files such as bare __init__.py
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modern Python syntax)
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks results
    "S105",  # tests use fake, clearly-named passwords
    "S106",
]

[tool.mypy]
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

# Database migrations. The database URL is not configured here: alembic/env.py
# reads it from app settings (CLOUDOPS_POSTGRES_* env vars / backend/.env).
[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
# Date-prefixed file names keep migrations in chronological order when listed.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
