name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway PostgreSQL for migrations and tests (same image as infra/postgres).
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: ci-only-password # disposable CI container, not a secret
          POSTGRES_DB: cloudops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudops -d cloudops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CLOUDOPS_POSTGRES_HOST: 127.0.0.1
      CLOUDOPS_POSTGRES_PORT: 5432
      CLOUDOPS_POSTGRES_USER: cloudops
      CLOUDOPS_POSTGRES_PASSWORD: ci-only-password
      CLOUDOPS_POSTGRES_DB: cloudops

    steps:
      # Actions are pinned to full commit SHAs: tags can be moved, SHAs cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models and migrations are in sync
        run: uv run alembic check

      - name: Test with coverage (fails below 80%)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      # Shows the coverage table on the workflow run's summary page.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn

  security:
    name: Security scans
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # full history, so Gitleaks scans every commit
          persist-credentials: false # don't leave the token in .git/config

      # Scanners are official release binaries verified against pinned SHA-256
      # checksums, instead of third-party actions (trivy-action tags were
      # hijacked in March 2026, CVE-2026-33634).
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz

      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
          rm trivy.tar.gz

      - name: Scan git history for secrets (Gitleaks)
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose'

      # Runs even if Gitleaks failed, so both results are always reported.
      - name: Scan dependencies and config files (Trivy, settings in trivy.yaml)
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/trivy" fs --skip-version-check .'
