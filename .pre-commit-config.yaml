# Git hooks run on `git commit`. One-time setup per clone: `uv run pre-commit install`
# (from backend/). Run on everything: `uv run pre-commit run --all-files`.
# Tool versions match backend/uv.lock; CI runs the same checks as a backstop.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock
        args: [--check, --project, backend]
        files: ^backend/(pyproject\.toml|uv\.lock)$

  # mypy runs in the project's own environment so it sees installed packages
  # and the [tool.mypy] settings in backend/pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
